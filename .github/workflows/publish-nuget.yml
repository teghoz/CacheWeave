name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'           # triggers on v1.0.0, v1.2.3-beta, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.1). Overrides the git tag.'
        required: true
        type: string
      release_notes:
        description: 'Release notes (markdown). Used for NuGet PackageReleaseNotes and GitHub Release body.'
        required: false
        type: string

jobs:
  publish:
    name: Build, Test & Publish
    # Windows is required to build and test the net48 CacheWeave.Legacy project
    runs-on: windows-latest

    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to read annotated tag messages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Resolve version and release notes
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $notes   = "${{ inputs.release_notes }}"
          } else {
            # Strip leading 'v' from tag name (v1.0.1 → 1.0.1)
            $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
            # Read the body of the annotated tag
            $notes = git tag -l --format='%(contents)' "$env:GITHUB_REF_NAME"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $notes | Out-File -FilePath "$env:TEMP\release_notes.md" -Encoding utf8
          Write-Host "Publishing version $version"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore CacheWeave.slnx

      - name: Test (modern .NET)
        shell: pwsh
        run: |
          dotnet build tests/CacheWeave.Tests/CacheWeave.Tests.csproj --configuration Release --no-restore
          dotnet test  tests/CacheWeave.Tests/CacheWeave.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test (net48 — CacheWeave.Legacy)
        shell: pwsh
        run: |
          dotnet build tests/CacheWeave.Legacy.Tests/CacheWeave.Legacy.Tests.csproj --configuration Release --no-restore
          dotnet test  tests/CacheWeave.Legacy.Tests/CacheWeave.Legacy.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack all packages
        shell: pwsh
        run: |
          $notes = Get-Content "$env:TEMP\release_notes.md" -Raw
          $projects = @(
            "src/CacheWeave.Core/CacheWeave.Core.csproj"
            "src/CacheWeave.Redis/CacheWeave.Redis.csproj"
            "src/CacheWeave.InMemory/CacheWeave.InMemory.csproj"
            "src/CacheWeave.DistributedCache/CacheWeave.DistributedCache.csproj"
            "src/CacheWeave.SQLite/CacheWeave.SQLite.csproj"
            "src/CacheWeave.DynamoDB/CacheWeave.DynamoDB.csproj"
            "src/CacheWeave.Memcached/CacheWeave.Memcached.csproj"
            "src/CacheWeave.NCache/CacheWeave.NCache.csproj"
            "src/CacheWeave.Faster/CacheWeave.Faster.csproj"
            "src/CacheWeave.Legacy/CacheWeave.Legacy.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --output ./nupkg `
              -p:Version=${{ steps.meta.outputs.VERSION }} `
              "-p:PackageReleaseNotes=$notes"
          }
          Write-Host "Packages produced:"
          Get-ChildItem ./nupkg

      - name: Publish to NuGet
        shell: pwsh
        run: |
          Get-ChildItem ./nupkg/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.meta.outputs.VERSION }}"
          # When triggered by a tag push the tag already exists; for workflow_dispatch
          # it may not, so create/update it pointing at HEAD before creating the release.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git tag $tag --force
            git push origin $tag --force
            gh release create $tag --title $tag --notes-file "$env:TEMP\release_notes.md"
          } else {
            gh release create $tag --title $tag --notes-file "$env:TEMP\release_notes.md" --verify-tag
          }
